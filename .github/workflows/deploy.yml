# GitHub Pages тепер лише редирект на alexbentsa.com (основний хостинг: Cloudflare)
name: Redirect GitHub Pages to alexbentsa.com
on:
  push:
    branches: [main, claude/determined-ritchie-6vjlx6]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect page
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="uk"><head><meta charset="utf-8"><title>alexbentsa.com</title>
          <meta name="robots" content="noindex"><link rel="canonical" href="https://alexbentsa.com/">
          <meta http-equiv="refresh" content="0; url=https://alexbentsa.com/">
          <script>location.replace('https://alexbentsa.com/' + location.pathname.replace(/^\/portfolio\/?/, '') + location.search + location.hash)</script>
          </head><body><p>Сайт переїхав: <a href="https://alexbentsa.com/">alexbentsa.com</a></p></body></html>
          HTML
          cp _site/index.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
